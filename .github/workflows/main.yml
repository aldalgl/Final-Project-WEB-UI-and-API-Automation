name: Web & API Automation CI

# Workflow berjalan pada 2 event:
# 1. Manual trigger lewat tab Actions di GitHub ("Run workflow")
# 2. Otomatis setiap kali ada Pull Request (dibuat/diupdate) ke branch main/master
on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]
    types: [ opened, synchronize, reopened ]

jobs:
  web-and-api-automation-test:
    name: Run Web UI (Selenium) & API (RestAssured) Tests
    runs-on: ubuntu-latest

    env:
      # WAJIB diisi di: repo Settings > Secrets and variables > Actions > New repository secret
      # Daftar gratis di https://dummyapi.io untuk mendapatkan app-id
      APP_ID: ${{ secrets.APP_ID }}

    steps:
      - name: Checkout kode repository
        uses: actions/checkout@v4

      # ---------- Environment: Java 21 ----------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # ---------- Environment: Chrome untuk Selenium ----------
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------- Jalankan Web UI test (tag @web) ----------
      - name: Run Web UI Automation Tests (@web)
        run: ./gradlew webTest --stacktrace

      # ---------- Jalankan API test (tag @api) ----------
      - name: Run API Automation Tests (@api)
        run: ./gradlew apiTest --stacktrace

      # ---------- Generate laporan Allure gabungan ----------
      - name: Generate Allure Report
        if: always()
        run: ./gradlew allureReport

      # ---------- Upload laporan Allure sebagai artefak ----------
      - name: Upload Allure Report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/reports/allure-report
          retention-days: 14

      # ---------- Upload laporan Cucumber (HTML & JSON) sebagai artefak ----------
      - name: Upload Cucumber HTML/JSON report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: build/cucumber-report
          retention-days: 14

      # ---------- Upload hasil mentah TestNG + screenshot kegagalan ----------
      - name: Upload raw test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-results
          path: |
            build/allure-results
            build/test-results
          retention-days: 14
